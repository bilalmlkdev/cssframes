    />

    <script>
      // Apply the saved theme before first paint so there is no flash.
      try {
        var t = localStorage.getItem("cssframes-theme");
        if (
          t === "dark" ||
          (!t && window.matchMedia("(prefers-color-scheme: dark)").matches)
        ) {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {
        /* no storage */
      }
    </script>
